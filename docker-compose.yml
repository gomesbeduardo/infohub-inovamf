# Postgres para rodar o InfoHub localmente. Os dados batem com backend/.env.example.
#   docker compose up -d     sobe o banco
#   docker compose down -v   derruba e apaga os dados
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: infohub
      POSTGRES_PASSWORD: infohub
      POSTGRES_DB: infohub
    ports:
      - "127.0.0.1:5544:5432"
    volumes:
      - infohub-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U infohub -d infohub"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  infohub-pgdata:
