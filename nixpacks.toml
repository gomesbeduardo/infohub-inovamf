# Build pack do Coolify para o monorepo inteiro num único resource.
# No Coolify: Build Pack = Nixpacks, Base Directory = / (raiz), Port = 3000.
#
# Sobe DOIS processos no mesmo container (ver scripts/start-all.mjs):
#   - Express  em 127.0.0.1:3333  (interno, não exposto)
#   - Next.js  em 0.0.0.0:3000    (única porta pública)
# O Next repassa /api/* para o Express (rewrite em frontend/next.config.mjs),
# então front e API compartilham o mesmo domínio e não há CORS entre eles.

[phases.setup]
# openssl: exigido pelos engines do Prisma.
nixPkgs = ['nodejs_22', 'openssl']

[phases.install]
# --include=dev: o build precisa de TypeScript/Next, e o Coolify exporta
# NODE_ENV=production (que faria o npm pular as devDependencies).
cmds = [
  'npm --prefix backend ci --include=dev',
  'npm --prefix frontend ci --include=dev',
]

[phases.build]
cmds = ['npm run build']

[start]
cmd = 'npm start'
